<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all jewellery — Aurelle</title>
<meta name="description" content="Filter Aurelle jewellery by category, price, metal and occasion. Anti-tarnish, skin-friendly, 7-day returns.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1512'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23b8935a' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="collection" data-nav="Category">
<main id="main">
  <div class="container">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a><span>/</span><span id="plpCrumb">All jewellery</span>
    </nav>
  </div>

  <section class="collection-band">
    <div class="container">
      <p class="eyebrow">The collection</p>
      <h1 id="plpTitle">All jewellery</h1>
      <p>Every piece is 24Kt gold-plated over nickel-free brass, sealed against tarnish and covered for six months.</p>
    </div>
  </section>

  <section class="section section--tight" id="plpTop">
    <div class="container">
      <div class="plp">
        <aside id="filterSheet">
          <div class="filter-sheet-head">
            <h3>Filter</h3>
            <button class="icon-btn" type="button" id="closeFilters" aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="filters">
            <div class="field search-wrap" style="margin-bottom:var(--space-5)">
              <label for="plpSearch">Search</label>
              <input type="search" id="plpSearch" autocomplete="off"
                     placeholder="Try “tennis” or “bridal”">
              <div class="suggest" id="searchSuggest" hidden></div>
            </div>
            <div id="filters"></div>
            <div class="filter-sheet-foot">
              <button class="btn btn--primary btn--block" type="button" id="applyFilters">
                Show results</button>
            </div>
          </div>
        </aside>

        <div>
          <!-- Phone-width controls: filter sheet, sort, and category chips. -->
          <div class="plp-mobile-bar">
            <button type="button" id="openFilters">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
              Filter <span id="filterCount"></span>
            </button>
            <span class="divider"></span>
            <label style="display:flex;align-items:center;gap:6px">
              Sort
              <select id="plpSortMobile" style="border:0;background:none;font-family:var(--font-sans)">
                <option value="featured">Featured</option>
                <option value="new">Newest</option>
                <option value="popular">Most reviewed</option>
                <option value="rating">Highest rated</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
              </select>
            </label>
          </div>
          <div class="cat-chips" id="catChips"></div>

          <div class="plp__bar">
            <span class="plp__count" id="plpCount">—</span>
            <label style="display:flex;align-items:center;gap:var(--space-3);font-size:var(--fs-xs);letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--text-secondary)">
              Sort
              <select class="select" id="plpSort" aria-label="Sort products">
                <option value="featured">Featured</option>
                <option value="new">Newest first</option>
                <option value="popular">Most reviewed</option>
                <option value="rating">Highest rated</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
              </select>
            </label>
          </div>
          <div class="chips" id="activeChips"></div>
          <div id="plpGrid"></div>
          <div class="pagination" id="plpPager"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/media.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
